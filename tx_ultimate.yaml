  - platform: template
    name: "Very Long Press"
    id: very_long_press
    on_press:
     - delay: ${button_on_time}
     - binary_sensor.template.publish:
         id: very_long_press
         state: OFF

switch:
  - platform: gpio
    id: relay_1
    name: "${friendly_name} L1"
    pin: ${relay_1_pin}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: relay_2
    name: "${friendly_name} L2"
    pin: ${relay_2_pin}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: relay_3
    name: "${friendly_name} L3"
    pin: ${relay_3_pin}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: relay_4
    name: "${friendly_name} L4"
    pin: ${relay_4_pin}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: vibra
    pin: ${vibra_motor_pin}
    name: "${friendly_name} Vibration"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: ${vibra_time}
      - switch.turn_off: vibra

  # Speaker amplifier enable. Kept always on so short touch clicks aren't clipped
  # by amplifier wake-up time. If it hisses when idle, switch to ALWAYS_OFF and
  # enable the amp_hold script below (search for "amp_hold").
  - platform: gpio
    id: pa_power
    pin: ${pa_power_pin}
    name: "PA Power"
    internal: true
    restore_mode: ALWAYS_ON

  - platform: gpio
    name: "touch panel power"
    pin:
      number: ${touchpanel_power_pin}
      inverted: true
      ignore_strapping_warning: true  # fixed by the hardware design
    id: touch_power
    internal: true
    restore_mode: RESTORE_DEFAULT_ON

  # Internal: whether the nightlight LEDs are currently lit (set by refresh_nightlight)
  - platform: template
    name: "Nightlight Lit"
    id: nightlight
    internal: true
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: led_on_nightlight
    on_turn_off:
      - light.turn_off: leds_nightlight

  # User-facing: enable the nightlight (lights up when the sun is below the horizon)
  - platform: template
    name: "Nightlight"
    id: nightlight_active
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: refresh_nightlight
    on_turn_off:
      - script.execute: refresh_nightlight

  - platform: template
    name: "${friendly_name} Touch Sound"
    id: touch_sound_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  - platform: restart
    name: "${friendly_name} Restart"

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    chipset: WS2811
    pin: ${led_pin}
    num_leds: 28
    name: "NeoPixel Light"
    id: leds
    default_transition_length: 0s
    effects:
      - addressable_rainbow:
          name: "Rainbow"
          speed: 3
          width: 8
      - pulse:
          name: "Pulse"
          transition_length: 1.4s
          update_interval: 100ms
# Flicker doesn't appear to do anything
      - addressable_flicker:
          name: "Flicker"

  - platform: partition
    name: "LEDs Nightlight"
    id: leds_nightlight
    internal: true
    segments:
      - id: leds
        from: 0
        to: 6
      - id: leds
        from: 8
        to: 8
      - id: leds
        from: 10
        to: 10
      - id: leds
        from: 12
        to: 19
      - id: leds
        from: 27
        to: 27
      - id: leds_top
        from: 0
        to: 6

  - platform: partition
    name: "All LEDs"
    id: all_leds
    internal: true
    segments:
      - id: leds
        from: 0
        to: 27

  - platform: partition
    name: "LEDs Top"
    id: leds_top
    internal: true
    segments:
      - id: leds
        from: 20
        to: 26
    effects:
      - addressable_scan:
          name: "Scan"
      - addressable_rainbow:
          name: "Rainbow"
          speed: 100
          width: 20
# Flicker doesn't appear to do anything
      - addressable_flicker:
          name: "Flicker"

# ---------------------------------------------------------------------------
# Audio: I2S -> external amp (enabled by pa_power).
# Feedback sounds (rtttl) and Home Assistant media/announcements are mixed, so a
# touch click can play over an announcement. Settings follow TX-Ultimate-Easy:
# https://github.com/edwardtfn/TX-Ultimate-Easy/tree/main/ESPHome
# ---------------------------------------------------------------------------
i2s_audio:
  - id: i2s_bus
    i2s_bclk_pin:
      number: ${audio_bclk_pin}
      ignore_strapping_warning: true
    i2s_lrclk_pin: ${audio_lrclk_pin}

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin:
      number: ${audio_sdata_pin}
      ignore_strapping_warning: true
    i2s_comm_fmt: stand_msb   # the TX Ultimate amp needs MSB-justified data; the default gives static
    channel: mono
    timeout: never            # keep I2S running so sounds don't pop when they start

  - platform: mixer
    id: spk_mixer
    output_speaker: spk
    source_speakers:
      - id: announce_spk
      - id: media_spk
      - id: fx_spk

  - platform: resampler
    id: announce_in
    output_speaker: announce_spk
  - platform: resampler
    id: media_in
    output_speaker: media_spk
  - platform: resampler
    id: fx_in
    output_speaker: fx_spk

media_player:
  - platform: speaker
    id: mp
    name: "${friendly_name} Player"
    buffer_size: 250000       # no PSRAM on this board; lower this if you see allocation failures
    task_stack_in_psram: false
    # Volume is software gain: the slider maps linearly to -49..0 dB, so the default
    # 50% is about -25 dB (quiet). 100% is the loudest possible; the amp's gain is fixed.
    # This only applies until a volume is saved; after that, set it from Home Assistant.
    volume_initial: 1.0
    files:
      - id: on_sound
        file: sounds/on.wav
      - id: off_sound
        file: sounds/off.wav
    announcement_pipeline:
      speaker: announce_in
      format: WAV
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      speaker: media_in
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    # If pa_power is switched instead of always on, uncomment these (and the amp_hold script):
    # on_play:
    #   - script.execute: amp_hold
    # on_announcement:
    #   - script.execute: amp_hold

rtttl:
  - id: beeper
    speaker: fx_in
    # All speakers share the I2S speaker's single volume, and rtttl sets it to this
    # gain each time it plays (default 0.6, about -20 dB), which also turns HA media down.
    gain: 1.0

# Long-press brightness per button, 0-100%. Published every brightness_interval
# while the button is held, so a Home Assistant automation can follow it live.
sensor:
  - platform: template
    id: brightness_level_1
    name: "Button 1 Brightness Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    icon: mdi:brightness-percent
  - platform: template
    id: brightness_level_2
    name: "Button 2 Brightness Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    icon: mdi:brightness-percent
  - platform: template
    id: brightness_level_3
    name: "Button 3 Brightness Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    icon: mdi:brightness-percent
  - platform: template
    id: brightness_level_4
    name: "Button 4 Brightness Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    icon: mdi:brightness-percent

select:
  - platform: template
    id: swipe_effect
    name: "${friendly_name} Swipe Effect"
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Knight Rider"
      - "Knight Rider 2 (staggered fade)"
      - "Knight Rider 3 (comet)"
    initial_option: "Knight Rider"

uart:
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  id: my_uart
  baud_rate: 115200
  data_bits: 8
  stop_bits: 1
  parity: NONE

tx_ultimate_touch:
  id: tx_touch
  uart: my_uart

  on_press:
    - lambda: |-
        auto button = id(button_lookup)[${button_count}-1][touch.x-1];
        ESP_LOGI("button", "Touch Position: %d, State: %d, Button: %d at %" PRIu32, touch.x, touch.state, button, millis());
        id(button_held)[button-1] = 1;
        id(led_on_button_press)->execute(button);
    - switch.turn_on: vibra
    # TEST: play on.wav on every button press (replaces the click for presses).
    # To go back to the click, uncomment this and remove the media_player:
    # - script.execute: play_touch_sound
    - media_player.speaker.play_on_device_media_file:
        id: mp
        media_file: on_sound
        announcement: true

  on_release:
    - script.stop: led_on_button_press
    - lambda: id(handle_on_release).execute(touch.x);

  on_swipe_left:
    - script.execute: led_on_swipe_left
    - switch.turn_on: vibra
    - script.execute: play_touch_sound
    - binary_sensor.template.publish:
        id: swipe_left
        state: ON
    - lambda: >
        ESP_LOGD("button", "Swipe Left Position: %d / State: %d", touch.x, touch.state);

  on_swipe_right:
    - script.execute: led_on_swipe_right
    - switch.turn_on: vibra
    - script.execute: play_touch_sound
    - binary_sensor.template.publish:
        id: swipe_right
        state: ON
    - lambda: >
        ESP_LOGD("button", "Swipe Right Position: %d / State: %d", touch.x, touch.state);

  on_multi_touch_release:
    - script.execute: led_on_multi_touch
    - switch.turn_on: vibra
    - script.execute: play_touch_sound
    - binary_sensor.template.publish:
        id: multi_touch
        state: ON
    - lambda: |-
        ESP_LOGD("button", "Multi Touch Release");

  on_long_touch:
    - lambda: |-
        ESP_LOGD("button", "Very Long Touch Event Position: %d / State: %d", touch.x, touch.state);
        id(handle_on_release).execute(touch.x);
    - switch.turn_on: vibra
    - binary_sensor.template.publish:
       id: very_long_press
       state: ON

time:
  - platform: sntp
    id: sntp_time
    on_time_sync:
      - script.execute: refresh_nightlight
    on_time:
      # Every 5 minutes
      - seconds: 0
        minutes: /5
        then:
          - script.execute: refresh_nightlight

sun:
  latitude: ${latitude}
  longitude: ${longitude}

script:
  # ---------------------------------------------------------------------------
  # Button LEDs
  # ---------------------------------------------------------------------------

  # Set a button's LEDs to a color. With save=true (a new touch), first remember
  # what the LEDs showed so dim_button can fade back to it, and cancel any fade in
  # progress; if one was pending or running, the saved color is still the real
  # original, so it is kept. With save=false (long-press color, blinks), only the
  # color changes and a pending fade still runs afterwards.
  - id: light_button
    mode: parallel
    parameters:
      button: int
      save: bool
      r: int
      g: int
      b: int
    then:
      - lambda: |-
          auto *out = static_cast<light::AddressableLight *>(id(all_leds).get_output());
          int leds[2];
          int n = id(tx_touch).get_button_leds(button, ${button_count}, ${button_led_feedback_bottom}, ${button_led_feedback_top}, leds);
          for (int i = 0; i < n; i++) {
            if (save) {
              if (!id(tx_touch).is_fading(leds[i])) {
                id(original_led_color)[leds[i]] = (*out)[leds[i]].get();
              }
              id(tx_touch).cancel_fade(leds[i]);
            }
            (*out)[leds[i]] = Color(r, g, b);
          }
          out->schedule_show();

  # Fade a button's LEDs back to their saved colors (quadratic ease-in).
  - id: dim_button
    mode: parallel
    parameters:
      button: int
      extra_delay_ms: int
    then:
      - lambda: |-
          int leds[2];
          int n = id(tx_touch).get_button_leds(button, ${button_count}, ${button_led_feedback_bottom}, ${button_led_feedback_top}, leds);
          for (int i = 0; i < n; i++) {
            id(tx_touch).fade_led(leds[i], id(original_led_color)[leds[i]], ${dim_duration_ms}, ${after_touch_dim_delay_ms} + extra_delay_ms);
          }

  - id: led_on_button_press
    mode: parallel
    parameters:
      button: int
    then:
      - lambda: |-
          id(button_press_start_time)[button-1] = millis();
          auto &c = id(touch_color);
          id(light_button)->execute(button, true, c[0], c[1], c[2]);
      # on_release stops this script, so the rest only runs while the button is held
      - delay: ${long_press_time}ms
      - lambda: |-
          if (millis() - id(button_press_start_time)[button-1] >= ${long_press_time}) {
            ESP_LOGI("button", "button %d long pressed", button);
            auto &c = id(long_press_color);
            id(light_button)->execute(button, false, c[0], c[1], c[2]);
            id(vibra).turn_on();
            if (${long_hold_uses_bars}) {
              id(bars_go_up_and_down)->execute(button);
            }
          }

  - id: handle_on_release
    mode: parallel
    parameters:
      x: int
    then:
      - lambda: |-
          auto button = id(button_lookup)[${button_count}-1][x-1];
          id(button_held)[button-1] = 0;
          // unsigned subtraction stays correct across the millis() wrap
          uint32_t button_press_duration = millis() - id(button_press_start_time)[button-1];
          ESP_LOGD("button", "Button %d released, held for %" PRIu32 " ms", button, button_press_duration);
          binary_sensor::BinarySensor *const press[] = {id(button_1), id(button_2), id(button_3), id(button_4)};
          binary_sensor::BinarySensor *const long_press[] = {id(long_press_1), id(long_press_2), id(long_press_3), id(long_press_4)};
          if (button_press_duration >= ${long_press_time}) {
            ESP_LOGD("button", "Button %d long pressed", button);
            long_press[button-1]->publish_state(true);
          } else {
            id(button_double_tap)[button-1]++;
            id(double_tap_timer)->execute(button);
            // TODO maybe add triple tap?
            if (id(button_double_tap)[button-1] > 1) {
              ESP_LOGD("button", "Button %d double tapped", button);
              id(process_double_tap)->execute(button);
              id(button_double_tap)[button-1] = 0;
            } else {
              press[button-1]->publish_state(true);
            }
          }
          id(dim_button)->execute(button, 0);
          // releasing the button that owns the bars: stop them where they are,
          // then fade them back after the same delay as the button LEDs
          if (id(bars_active) && id(bars_button) == button) {
            id(bars_go_up_and_down)->stop();
            id(clear_bars)->execute(${after_touch_dim_delay_ms});
          }
          ESP_LOGD("button", "Release Button: %d", button);

  - id: double_tap_timer
    mode: restart
    parameters:
      button: int
    then:
      - delay: ${double_tap_timeout}
      - lambda: 'id(button_double_tap)[button-1] = 0;'

  - id: process_double_tap
    mode: parallel
    parameters:
      button: int
    then:
      - delay: ${double_tap_timeout}
      - lambda: |-
          id(stop_all).execute();
          ESP_LOGW("button", "Double tap at button %d", button);
          binary_sensor::BinarySensor *const double_tap[] = {id(double_tap_1), id(double_tap_2), id(double_tap_3), id(double_tap_4)};
          double_tap[button-1]->publish_state(true);
          // push the release fade back until the blinks below are done
          id(dim_button)->execute(button, 3 * ${blink_delay_ms});
          id(blink)->execute(button, 1);
      - delay: ${blink_delay_ms}ms
      - lambda: 'id(blink)->execute(button, 2);'
      - delay: ${blink_delay_ms}ms
      - lambda: 'id(blink)->execute(button, 1);'
      - delay: ${blink_delay_ms}ms
      - lambda: 'id(blink)->execute(button, 2);'

  - id: blink
    mode: parallel
    parameters:
      button: int
      stage: int
    then:
      - lambda: |-
          auto &c = (stage % 2 == 0) ? id(touch_color) : id(double_tap_color);
          id(light_button)->execute(button, false, c[0], c[1], c[2]);

  # ---------------------------------------------------------------------------
  # Long-press bars
  # ---------------------------------------------------------------------------
  - id: bars_go_up_and_down
    mode: restart
    parameters:
      button: int
    then:
      - lambda: |-
          // Save what the bar LEDs show now (e.g. the nightlight), so unlit bar
          // segments show it and clearing the bars fades back to it.
          if (!id(bars_active)) {
            auto *out = static_cast<light::AddressableLight *>(id(all_leds).get_output());
            for (int i = 0; i < 7; i++) {
              for (int led : {13 + i, i == 6 ? 27 : 5 - i}) {
                if (!id(tx_touch).is_fading(led)) {
                  id(original_led_color)[led] = (*out)[led].get();
                }
                id(tx_touch).cancel_fade(led);
              }
            }
            id(bars_active) = true;
            id(bar_shown_height) = -1;
          }
          id(bars_button) = button;
      - repeat:
          count: 600   # 60 s at 100 ms; releasing the button stops it sooner
          then:
            - lambda: |-
                if (id(button_held)[button-1] == 0) {
                  // normally handle_on_release has already stopped this script
                  id(clear_bars).execute(${after_touch_dim_delay_ms});
                  id(bars_go_up_and_down).stop();
                  return;
                }
                // ramp the brightness, bouncing between brightness_min_pct and 100%
                float &brightness = id(button_bar_brightness)[button-1];
                int8_t &dir = id(button_bar_flipper)[button-1];
                brightness += dir * ${brightness_step_pct};
                if (brightness >= 100.0f) { brightness = 100.0f; dir = -1; }
                if (brightness <= ${brightness_min_pct}) { brightness = ${brightness_min_pct}; dir = 1; }
                sensor::Sensor *const level[] = {id(brightness_level_1), id(brightness_level_2), id(brightness_level_3), id(brightness_level_4)};
                level[button-1]->publish_state(roundf(brightness));
                // the bars show it rounded to 7 segments
                id(set_bar_height).execute(button, (int) roundf(brightness * 7.0f / 100.0f));
            - delay: ${brightness_interval}

  # Two 7-LED bars: 13..19 going up one side, and 5,4,3,2,1,0,27 going up the other.
  # Only the segments that change are touched: newly lit ones fade in (linear) to
  # their gradient color, newly unlit ones fade out (quadratic) to the saved color.
  - id: set_bar_height
    mode: restart
    parameters:
      button: int
      height: int
    then:
      - lambda: |-
          // height 0 = only the bottom segment, glowing dimly (the ramp's minimum)
          const int h = std::max(0, std::min(height, 7));
          const int prev = id(bar_shown_height);  // -1 = nothing drawn yet
          if (h == prev) return;  // called every brightness step; only act when a segment changes
          ESP_LOGD("button", "set_bar_height to %d for button %d", h, button);
          // segment state for a given height: 0 = saved color, 1 = dim glow, 2 = lit
          auto state = [](int i, int height) { return height < 0 ? 0 : i < height ? 2 : (i == 0 && height == 0) ? 1 : 0; };
          for (int i = 0; i < 7; i++) {
            const int from = state(i, prev), to = state(i, h);
            if (from == to) continue;
            // segment i is lit with the color 1/7th..7/7th of the way from min to max
            Color lit = id(tx_touch).get_color_gradient(id(min_bar_color)[button-1], id(max_bar_color)[button-1], i + 1);
            if (to == 1) {
              const float k = ${bar_min_glow_pct} / 100.0f;
              lit = Color(static_cast<uint8_t>(lit.r * k), static_cast<uint8_t>(lit.g * k), static_cast<uint8_t>(lit.b * k));
            }
            for (int led : {13 + i, i == 6 ? 27 : 5 - i}) {
              if (to > from) {
                id(tx_touch).fade_led(led, lit, ${bar_fade_ms}, 0, tx_ultimate_touch::EASE_LINEAR);
              } else if (to == 1) {
                id(tx_touch).fade_led(led, lit, ${bar_fade_ms});
              } else {
                id(tx_touch).fade_led(led, id(original_led_color)[led], ${bar_fade_ms});
              }
            }
          }
          id(bar_shown_height) = h;

  # Fade the bars back to the colors saved when they started, after delay_ms.
  # Any segment still fading in stops where it is and waits there. Does nothing
  # if no bars are showing, so it is safe to call from stop_all.
  - id: clear_bars
    mode: restart
    parameters:
      delay_ms: int
    then:
      - lambda: |-
          if (!id(bars_active)) return;
          for (int i = 0; i < 7; i++) {
            for (int led : {13 + i, i == 6 ? 27 : 5 - i}) {
              id(tx_touch).cancel_fade(led);  // freeze at the current color
              id(tx_touch).fade_led(led, id(original_led_color)[led], ${dim_duration_ms}, delay_ms);
            }
          }
          id(bars_active) = false;
          id(bar_shown_height) = -1;
          id(bars_button) = 0;

  # ---------------------------------------------------------------------------
  # Swipes and multi-touch
  # ---------------------------------------------------------------------------
  - id: stop_all
    mode: restart
    then:
      - script.stop: led_on_button_press
      - script.stop: bars_go_up_and_down
      - script.execute:
          id: clear_bars
          delay_ms: 0

  # Remember what the swept LEDs show now, so they fade back to it instead of to
  # black. LEDs that are mid-fade or belong to a held button already have their
  # real original saved, so keep that. Shared by all knight_rider variants.
  - id: knight_rider_prepare
    then:
      - lambda: |-
          auto *out = static_cast<light::AddressableLight *>(id(all_leds).get_output());
          bool keep[28] = {};
          for (int b = 1; b <= ${button_count}; b++) {
            if (!id(button_held)[b-1]) continue;
            int leds[2];
            int n = id(tx_touch).get_button_leds(b, ${button_count}, true, true, leds);
            for (int i = 0; i < n; i++) keep[leds[i]] = true;
          }
          for (int i = 0; i < 7; i++) {
            int swept[2];
            int n = 0;
            if (${button_led_feedback_bottom}) swept[n++] = 6 + i;
            if (${button_led_feedback_top}) swept[n++] = 20 + i;
            for (int j = 0; j < n; j++) {
              int led = swept[j];
              if (!keep[led] && !id(tx_touch).is_fading(led)) {
                id(original_led_color)[led] = (*out)[led].get();
              }
              id(tx_touch).cancel_fade(led);
            }
          }

  # Original: sweep, then all swept LEDs fade out together.
  - id: knight_rider
    mode: restart
    parameters:
      left: bool
    then:
      - script.execute: knight_rider_prepare
      - repeat:
          count: 7
          then:
            - lambda: "id(knight_rider_on)->execute(iteration, left);"
            - delay: ${swipe_between_led_delay_ms}ms
      - lambda: |-
          for (int i = 0; i < 7; i++) {
            if (${button_led_feedback_bottom}) id(tx_touch).fade_led(6 + i, id(original_led_color)[6 + i], ${swipe_fade_ms});
            if (${button_led_feedback_top}) id(tx_touch).fade_led(20 + i, id(original_led_color)[20 + i], ${swipe_fade_ms});
          }

  # Sweep, then fade out in the order the LEDs lit up: the first-lit LED starts
  # dimming when the sweep ends, and each following one a step later.
  - id: knight_rider2
    mode: restart
    parameters:
      left: bool
    then:
      - script.execute: knight_rider_prepare
      - repeat:
          count: 7
          then:
            - lambda: "id(knight_rider_on)->execute(iteration, left);"
            - delay: ${swipe_between_led_delay_ms}ms
      - lambda: |-
          for (int i = 0; i < 7; i++) {
            const uint32_t delay = i * ${swipe_between_led_delay_ms};
            if (${button_led_feedback_bottom}) {
              int led = left ? 6 + i : 12 - i;
              id(tx_touch).fade_led(led, id(original_led_color)[led], ${swipe_fade_ms}, delay);
            }
            if (${button_led_feedback_top}) {
              int led = left ? 26 - i : 20 + i;
              id(tx_touch).fade_led(led, id(original_led_color)[led], ${swipe_fade_ms}, delay);
            }
          }

  # Comet: each LED starts dimming comet_tail_ms after it lights, while the sweep
  # is still moving, so a fading tail follows the head.
  - id: knight_rider3
    mode: restart
    parameters:
      left: bool
    then:
      - script.execute: knight_rider_prepare
      - repeat:
          count: 7
          then:
            - lambda: |-
                id(knight_rider_on)->execute(iteration, left);
                if (${button_led_feedback_bottom}) {
                  int led = left ? 6 + iteration : 12 - iteration;
                  id(tx_touch).fade_led(led, id(original_led_color)[led], ${swipe_fade_ms}, ${comet_tail_ms});
                }
                if (${button_led_feedback_top}) {
                  int led = left ? 26 - iteration : 20 + iteration;
                  id(tx_touch).fade_led(led, id(original_led_color)[led], ${swipe_fade_ms}, ${comet_tail_ms});
                }
            - delay: ${swipe_between_led_delay_ms}ms

  - id: knight_rider_on
    mode: restart
    parameters:
      iteration: int
      left: bool
    then:
      - lambda: |-
          auto *out = static_cast<light::AddressableLight *>(id(all_leds).get_output());
          Color gradient = left
            ? id(tx_touch).get_color_gradient(id(min_swipe_left_color), id(max_swipe_left_color), iteration)
            : id(tx_touch).get_color_gradient(id(min_swipe_right_color), id(max_swipe_right_color), iteration);
          if (${button_led_feedback_bottom}) {
            (*out)[left ? 6 + iteration : 12 - iteration] = gradient;
          }
          if (${button_led_feedback_top}) {
            (*out)[left ? 26 - iteration : 20 + iteration] = gradient;
          }
          out->schedule_show();

  # Runs the knight_rider variant chosen by the "Swipe Effect" select.
  - id: run_swipe_effect
    mode: restart
    parameters:
      left: bool
    then:
      - lambda: |-
          // stop any sweep still running, even one started by a different variant
          id(knight_rider)->stop();
          id(knight_rider2)->stop();
          id(knight_rider3)->stop();
          switch (id(swipe_effect).active_index().value_or(0)) {
            case 1: id(knight_rider2)->execute(left); break;
            case 2: id(knight_rider3)->execute(left); break;
            default: id(knight_rider)->execute(left); break;
          }

  - id: led_on_swipe_left
    mode: restart
    then:
      - script.execute: stop_all
      - script.execute:
          id: run_swipe_effect
          left: true

  - id: led_on_swipe_right
    mode: restart
    then:
      - script.execute: stop_all
      - script.execute:
          id: run_swipe_effect
          left: false

  - id: led_on_multi_touch
    mode: restart
    then:
      - script.execute: stop_all
      - lambda: |-
          // flash every button with the touch color, then fade them all back
          auto &c = id(touch_color);
          for (int b = 1; b <= ${button_count}; b++) {
            id(light_button)->execute(b, true, c[0], c[1], c[2]);
            id(dim_button)->execute(b, 0);
          }

  # Fade any LED to a color over duration_ms (quadratic ease-in), starting from
  # whatever it shows now. Safe to call for many LEDs at once.
  - id: transition_single_led
    mode: parallel
    parameters:
      led_index: int
      to_r: int
      to_g: int
      to_b: int
      duration_ms: int
    then:
      - lambda: 'id(tx_touch).fade_led(led_index, Color(to_r, to_g, to_b), duration_ms);'

  # ---------------------------------------------------------------------------
  # Nightlight
  # ---------------------------------------------------------------------------
  - id: refresh_nightlight
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: 'return strcmp("${nightlight}", "on") == 0 && id(nightlight_active).state;'
              - sun.is_below_horizon:
          then:
            - switch.turn_on: nightlight
          else:
            - switch.turn_off: nightlight

  - id: led_on_nightlight
    mode: restart
    then:
      - light.turn_on:
          id: leds_nightlight
          brightness: ${nightlight_brightness}
          red:   !lambda "return id(nightlight_color)[0]/100.0;"
          green: !lambda "return id(nightlight_color)[1]/100.0;"
          blue:  !lambda "return id(nightlight_color)[2]/100.0;"

  # ---------------------------------------------------------------------------
  # Sound
  # ---------------------------------------------------------------------------
  - id: play_touch_sound
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(touch_sound_enabled).state && strcmp("${touch_sound}", "none") != 0;'
          then:
            - rtttl.play:
                id: beeper
                rtttl: "${touch_sound}"

  # Only needed if pa_power is switched instead of always on (see the pa_power
  # switch). Call it from on_press and the media player's on_play/on_announcement;
  # play the touch sound on release so the amp has time to wake up.
  # - id: amp_hold
  #   mode: restart
  #   then:
  #     - switch.turn_on: pa_power
  #     - wait_until:
  #         lambda: 'return id(mp).state == media_player::MEDIA_PLAYER_STATE_IDLE;'
  #     - delay: 30s
  #     - switch.turn_off: pa_power
