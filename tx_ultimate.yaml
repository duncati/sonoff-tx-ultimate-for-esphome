substitutions:
  name: "shys-tx-ultimate"
  friendly_name: "TX Ultimate"

  button_count: "4"

  toggle_relay_1_on_touch: "false"
  toggle_relay_2_on_touch: "false"
  toggle_relay_3_on_touch: "false"
  toggle_relay_4_on_touch: "false"

  button_led_feedback_top: "true"
  button_led_feedback_bottom: "true"

  vibra_time: 150ms
  button_on_time: 500ms

  double_tap_timeout: 350ms
  double_tap_color: "{100, 0, 100}"
  blink_delay_ms: "150"

  nightlight: "on"
  nightlight_brightness: "0.2"
  nightlight_color: "{80,70,0}"

  latitude: "50.123456°"
  longitude: "5.654321°"

  touch_color: "{0,0,100}"

  long_hold_uses_bars: "true"
  # Long-press brightness: ramps up/down by brightness_step_pct every brightness_interval
  # while held (5% / 100ms = 2s from 0 to 100%), and is sent to Home Assistant each step.
  # The bars show it rounded to 7 segments.
  brightness_interval: 100ms
  brightness_step_pct: "5"
  # lowest brightness the ramp goes to before turning back up (0 would turn the light off)
  brightness_min_pct: "5"
  # Each bar segment fades in (linear) or out (quadratic) over this time
  bar_fade_ms: "250"
  # At the bottom of the ramp the bottom bar segment glows at this % of its lit color,
  # so the minimum brightness is still visible. LEDs are gamma corrected, so low
  # values look much dimmer than the number suggests.
  bar_min_glow_pct: "50"

  min_bar_color1: "{0,0,0}"
  max_bar_color1: "{255,0,0}"
  min_bar_color2: "{0,0,0}"
  max_bar_color2: "{0,255,0}"
  min_bar_color3: "{0,0,0}"
  max_bar_color3: "{0,0,255}"
  min_bar_color4: "{255,255,0}"
  max_bar_color4: "{255,0,0}"

  long_press_color: "{0,100,0}"
  long_press_time: "500"

  min_swipe_right_color: "{137,21,149}"
  max_swipe_right_color: "{255,195,91}"

  min_swipe_left_color: "{137,21,149}"
  max_swipe_left_color: "{255,195,91}"

  # LED fades (quadratic ease-in, run by the tx_ultimate_touch component)
  after_touch_dim_delay_ms: "500"
  dim_duration_ms: "500"
  swipe_between_led_delay_ms: "42"
  swipe_fade_ms: "500"
  # swipe comet: how long each LED stays lit before it starts dimming (used in knight_rider effectT)
  comet_tail_ms: "126"

  # Touch feedback sound (RTTTL). Use "none" to disable.
  # ~75 ms; a 15 ms click may be lost while the mixer/resampler pipeline starts up
  touch_rtttl: "click:d=16,o=6,b=200:c"
#  swipe_right_rtttl: "gliss_up:d=32,o=5,b=240:c,c#,d,d#,e,f,f#,g,g#,a,a#,b,6c"
#  swipe_left_rtttl: "gliss_down:d=32,o=6,b=240:c,5b,5a#,5a,5g#,5g,5f#,5f,5e,5d#,5d,5c#"

  relay_1_pin: GPIO18
  relay_2_pin: GPIO17
  relay_3_pin: GPIO27
  relay_4_pin: GPIO23

  vibra_motor_pin: GPIO21
  pa_power_pin: GPIO26

  led_pin: GPIO13
  status_led_pin: GPIO33

  uart_tx_pin: GPIO19
  uart_rx_pin: GPIO22

  audio_lrclk_pin: GPIO4
  audio_bclk_pin: GPIO2
  audio_sdata_pin: GPIO15

  touchpanel_power_pin: GPIO5

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: smarthomeyourself.tx_ultimate
    version: "1.0"

  on_boot:
    priority: -100
    then:
      - lambda: |-
          // the touch component runs all LED fades on this light
          id(tx_touch).set_light(static_cast<light::AddressableLight *>(id(all_leds).get_output()));
      - binary_sensor.template.publish:
          id: button_1
          state: OFF
      - binary_sensor.template.publish:
          id: button_2
          state: OFF
      - binary_sensor.template.publish:
          id: button_3
          state: OFF
      - binary_sensor.template.publish:
          id: button_4
          state: OFF
      - binary_sensor.template.publish:
          id: multi_touch
          state: OFF
      - binary_sensor.template.publish:
          id: swipe_left
          state: OFF
      - binary_sensor.template.publish:
          id: swipe_right
          state: OFF
      - binary_sensor.template.publish:
          id: double_tap_1
          state: OFF
      - binary_sensor.template.publish:
          id: double_tap_2
          state: OFF
      - binary_sensor.template.publish:
          id: double_tap_3
          state: OFF
      - binary_sensor.template.publish:
          id: double_tap_4
          state: OFF
      - binary_sensor.template.publish:
          id: long_press_1
          state: OFF
      - binary_sensor.template.publish:
          id: long_press_2
          state: OFF
      - binary_sensor.template.publish:
          id: long_press_3
          state: OFF
      - binary_sensor.template.publish:
          id: long_press_4
          state: OFF
      - binary_sensor.template.publish:
          id: very_long_press
          state: OFF
      - script.execute: refresh_nightlight

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended

logger:
#  hardware_uart: UART2
  level: DEBUG
  logs:
    # debug tags for touch/LED timing; set any of these to INFO to silence it
    # txu.raw: raw touch-panel frames      txu.fade: every LED fade
    # txu.led: button LED writes           txu.bars / txu.swipe: long-press bars / swipes
    binary_sensor: INFO
    light: INFO
    script: INFO
    switch: INFO
    #tx_ultimate_touch: INFO
    # Quieted while debugging touch/LED timing: these built-in components log on
    # every state change or audio event and bury the txu.* lines. WARN keeps their
    # warnings and errors (including "took a long time" timing warnings from
    # component). Remove a line to see that component's debug output again.
    sensor: WARN          # Brightness Level sensors publish every 100 ms during a long press
    media_player: WARN
    speaker_media_player: WARN
    speaker_media_player.pipeline: WARN
    audio_reader: WARN
    audio.decoder: WARN
    i2s_audio.speaker: WARN
    i2s_audio.speaker.std: WARN
    speaker_mixer: WARN
    resampler_speaker: WARN
    rtttl: WARN
    sun: WARN
    sntp: WARN
    time: WARN

dashboard_import:
