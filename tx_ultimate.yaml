switch:
  - platform: gpio
    id: relay_1
    name: "${friendly_name} L1"
    pin: ${relay_1_pin}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: relay_2
    name: "${friendly_name} L2"
    pin: ${relay_2_pin}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: relay_3
    name: "${friendly_name} L3"
    pin: ${relay_3_pin}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: relay_4
    name: "${friendly_name} L4"
    pin: ${relay_4_pin}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: vibra
    pin: ${vibra_motor_pin}
    name: "${friendly_name} Vibration"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: ${vibra_time}
      - switch.turn_off: vibra

  # Speaker amplifier enable. Kept always on so short touch clicks aren't clipped
  # by amplifier wake-up time. If it hisses when idle, switch to ALWAYS_OFF and
  # enable the amp_hold script below (search for "amp_hold").
  - platform: gpio
    id: pa_power
    pin: ${pa_power_pin}
    name: "PA Power"
    internal: true
    restore_mode: ALWAYS_ON

  - platform: gpio
    name: "touch panel power"
    pin:
      number: ${touchpanel_power_pin}
      inverted: true
      ignore_strapping_warning: true  # fixed by the hardware design
    id: touch_power
    internal: true
    restore_mode: RESTORE_DEFAULT_ON

  # Internal: whether the nightlight LEDs are currently lit (set by refresh_nightlight)
  - platform: template
    name: "Nightlight Lit"
    id: nightlight
    internal: true
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: led_on_nightlight
    on_turn_off:
      - light.turn_off: leds_nightlight

  # User-facing: enable the nightlight (lights up when the sun is below the horizon)
  - platform: template
    name: "Nightlight"
    id: nightlight_active
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: refresh_nightlight
    on_turn_off:
      - script.execute: refresh_nightlight

  - platform: template
    name: "${friendly_name} Touch Sound"
    id: touch_sound_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

  - platform: restart
    name: "${friendly_name} Restart"

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    chipset: WS2811
    pin: ${led_pin}
    num_leds: 28
    name: "NeoPixel Light"
    id: leds
    default_transition_length: 0s
    effects:
      - addressable_rainbow:
          name: "Rainbow"
          speed: 3
          width: 8
      - pulse:
          name: "Pulse"
          transition_length: 1.4s
          update_interval: 100ms
# Flicker doesn't appear to do anything
      - addressable_flicker:
          name: "Flicker"

      # -----------------------------------------------------------------------
      # Ring effects. The 28 LEDs form a ring: index increases clockwise and
      # LED 23 is the top center (12 o'clock), LED 9 the bottom center.
      # Effects that use current_color follow the color picked in Home Assistant.
      # -----------------------------------------------------------------------

      # Slow, calm breathing of the whole ring in the chosen color (6 s cycle).
      - addressable_lambda:
          name: "Breathe"
          update_interval: 20ms
          lambda: |-
            const float t = millis() / 1000.0f;
            const float k = 0.08f + 0.92f * (0.5f - 0.5f * cosf(t * 6.2831853f / 6.0f));
            it.all() = Color(current_color.r * k, current_color.g * k, current_color.b * k);

      # A comet in the chosen color circling clockwise with a fading tail.
      - addressable_lambda:
          name: "Orbit"
          update_interval: 20ms
          lambda: |-
            const int n = it.size();
            const float head = fmodf(millis() / 2500.0f, 1.0f) * n;
            for (int i = 0; i < n; i++) {
              const float behind = fmodf(head - i + n, n);  // LEDs behind the head
              float k = behind < 9.0f ? 1.0f - behind / 9.0f : 0.0f;
              k *= k;
              it[i] = Color(current_color.r * k, current_color.g * k, current_color.b * k);
            }

      # Two comets in opposite colors circling in opposite directions; they blend where they cross.
      - addressable_lambda:
          name: "Twin Orbit"
          update_interval: 20ms
          lambda: |-
            const int n = it.size();
            const uint32_t now = millis();
            const uint8_t hue = (now / 120) & 0xFF;  // both colors drift slowly around the wheel
            const Color a = light::ESPHSVColor(hue, 255, 255).to_rgb();
            const Color b = light::ESPHSVColor(hue + 128, 255, 255).to_rgb();
            const float h1 = fmodf(now / 3000.0f, 1.0f) * n;
            const float h2 = n - fmodf(now / 3700.0f, 1.0f) * n;
            for (int i = 0; i < n; i++) {
              float k1 = fmodf(h1 - i + n, n), k2 = fmodf(i - h2 + 2 * n, n);
              k1 = k1 < 6.0f ? (1.0f - k1 / 6.0f) * (1.0f - k1 / 6.0f) : 0.0f;
              k2 = k2 < 6.0f ? (1.0f - k2 / 6.0f) * (1.0f - k2 / 6.0f) : 0.0f;
              it[i] = Color(std::min(255.0f, a.r * k1 + b.r * k2),
                            std::min(255.0f, a.g * k1 + b.g * k2),
                            std::min(255.0f, a.b * k1 + b.b * k2));
            }

      # Northern lights: slow, overlapping waves of green, teal and violet.
      - addressable_lambda:
          name: "Aurora"
          update_interval: 30ms
          lambda: |-
            const int n = it.size();
            const float t = millis() / 1000.0f;
            for (int i = 0; i < n; i++) {
              const float a = i * 6.2831853f / n;
              const float shade = 0.5f + 0.5f * sinf(2 * a + t * 0.31f);
              float glow = 0.5f + 0.5f * sinf(3 * a - t * 0.23f + 1.3f) * sinf(a + t * 0.17f);
              glow = 0.15f + 0.85f * glow * glow;
              const uint8_t hue = 85 + shade * 105;  // green (85) .. violet (190)
              it[i] = light::ESPHSVColor(hue, 230, 255 * glow).to_rgb();
            }

      # Rolling blue and teal swells with white foam on the crests.
      - addressable_lambda:
          name: "Ocean"
          update_interval: 25ms
          lambda: |-
            const int n = it.size();
            const float t = millis() / 1000.0f;
            for (int i = 0; i < n; i++) {
              const float a = i * 6.2831853f / n;
              const float swell = 0.5f + 0.5f * sinf(2 * a - t * 0.9f) * cosf(a + t * 0.25f);
              const uint8_t hue = 160 - swell * 30;  // deep blue .. teal
              Color c = light::ESPHSVColor(hue, 255, 60 + 195 * swell).to_rgb();
              if (swell > 0.88f) {  // foam
                const float foam = (swell - 0.88f) / 0.12f;
                c = Color(c.r + (255 - c.r) * foam * 0.7f, c.g + (255 - c.g) * foam * 0.7f, c.b + (255 - c.b) * foam * 0.7f);
              }
              it[i] = c;
            }

      # Warm blobs of red, orange and magenta drifting slowly around the ring.
      - addressable_lambda:
          name: "Lava Lamp"
          update_interval: 30ms
          lambda: |-
            const int n = it.size();
            const float t = millis() / 1000.0f;
            const float centers[3] = {fmodf(t * 1.1f, n), fmodf(n - t * 0.7f + 9, n), fmodf(t * 0.45f + 18, n)};
            const uint8_t hues[3] = {0, 18, 235};  // red, orange, magenta
            for (int i = 0; i < n; i++) {
              float r = 0, g = 0, b = 0;
              for (int j = 0; j < 3; j++) {
                float d = fabsf(i - centers[j]);
                d = std::min(d, n - d);  // distance around the ring
                const float k = expf(-d * d / 10.0f);
                const Color c = light::ESPHSVColor(hues[j], 255, 255).to_rgb();
                r += c.r * k; g += c.g * k; b += c.b * k;
              }
              it[i] = Color(std::min(255.0f, r + 6), std::min(255.0f, g), std::min(255.0f, b + 2));
            }

      # Each LED flickers like its own candle flame.
      - addressable_lambda:
          name: "Candle"
          update_interval: 40ms
          lambda: |-
            static float level[28], target[28];
            const int n = std::min(28, (int) it.size());
            for (int i = 0; i < n; i++) {
              if (initial_run) { level[i] = target[i] = 0.7f; }
              if (random_float() < 0.15f) target[i] = 0.35f + 0.65f * random_float();
              level[i] += (target[i] - level[i]) * 0.35f;
              it[i] = Color(255 * level[i], 120 * level[i] * level[i], 25 * level[i] * level[i]);
            }

      # Deep night blue with stars that twinkle in and out.
      - addressable_lambda:
          name: "Starfield"
          update_interval: 25ms
          lambda: |-
            static float star[28];
            const int n = std::min(28, (int) it.size());
            if (initial_run) for (int i = 0; i < n; i++) star[i] = 0;
            if (random_float() < 0.12f) star[random_uint32() % n] = 1.0f;
            for (int i = 0; i < n; i++) {
              star[i] *= 0.94f;
              const float s = star[i];
              it[i] = Color(4 + 251 * s, 6 + 249 * s, 40 + 215 * s);
            }

      # A "lub-dub" double pulse in the chosen color, about 50 beats per minute.
      - addressable_lambda:
          name: "Heartbeat"
          update_interval: 20ms
          lambda: |-
            const float p = fmodf(millis() / 1200.0f, 1.0f);
            auto beat = [](float x, float at, float width) { const float d = (x - at) / width; return expf(-d * d); };
            const float k = std::min(1.0f, 0.06f + beat(p, 0.10f, 0.045f) + 0.6f * beat(p, 0.32f, 0.055f));
            it.all() = Color(current_color.r * k, current_color.g * k, current_color.b * k);

      # Analog clock: amber hour hand, cyan minute hand, dim white second dot,
      # faint markers at 12/3/6/9. Shows a slow blue pulse until the time is synced.
      - addressable_lambda:
          name: "Clock"
          update_interval: 200ms
          lambda: |-
            const int n = it.size();
            auto pos = [n](float fraction) { return (23 + (int) roundf(fraction * n)) % n; };  // 23 = 12 o'clock
            auto now = id(sntp_time).now();
            if (!now.is_valid()) {
              const float k = 0.1f + 0.2f * (0.5f + 0.5f * sinf(millis() / 600.0f));
              it.all() = Color(0, 0, 255 * k);
              return;
            }
            it.all() = Color(0, 0, 0);
            for (int q = 0; q < 4; q++) it[pos(q / 4.0f)] = Color(12, 12, 12);
            it[pos(now.second / 60.0f)] = Color(40, 40, 40);
            const int m = pos((now.minute + now.second / 60.0f) / 60.0f);
            it[m] = Color(0, 200, 255);
            const int h = pos(((now.hour % 12) + now.minute / 60.0f) / 12.0f);
            it[h] = Color(255, 140, 0);
            it[(h + 1) % n] = Color(90, 50, 0);
            it[(h + n - 1) % n] = Color(90, 50, 0);

  - platform: partition
    name: "LEDs Nightlight"
    id: leds_nightlight
    internal: true
    segments:
      - id: leds
        from: 0
        to: 6
      - id: leds
        from: 8
        to: 8
      - id: leds
        from: 10
        to: 10
      - id: leds
        from: 12
        to: 19
      - id: leds
        from: 27
        to: 27
      - id: leds_top
        from: 0
        to: 6

  - platform: partition
    name: "All LEDs"
    id: all_leds
    internal: true
    segments:
      - id: leds
        from: 0
        to: 27

  - platform: partition
    name: "LEDs Top"
    id: leds_top
    internal: true
    segments:
      - id: leds
        from: 20
        to: 26
    effects:
      - addressable_scan:
          name: "Scan"
      - addressable_rainbow:
          name: "Rainbow"
          speed: 100
          width: 20
# Flicker doesn't appear to do anything
      - addressable_flicker:
