  - platform: template
    name: "Long Press 1"
    id: long_press_1
    on_press:
      - delay: ${button_on_time}
      - binary_sensor.template.publish:
          id: long_press_1
          state: OFF

  - platform: template
    name: "Long Press 2"
    id: long_press_2
    on_press:
      - delay: ${button_on_time}
      - binary_sensor.template.publish:
          id: long_press_2
          state: OFF

  - platform: template
    name: "Long Press 3"
    id: long_press_3
    on_press:
      - delay: ${button_on_time}
